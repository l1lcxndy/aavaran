<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AAVARAN</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#13171c; --line:#232a33; --ink:#e6edf3; --dim:#8b98a8;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff; --mark:#ff00ff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; width:780px; max-height:600px; overflow-y:auto;
    background:var(--bg); color:var(--ink);
    font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header h1{font-size:14px; margin:0; letter-spacing:.14em; font-weight:600}
  header .sub{color:var(--dim); font-size:11px}
  .spacer{flex:1}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:5px}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .status{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .bar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
  input[type=text]{
    flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:7px 10px; border-radius:6px; font-size:13px; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  button{
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:7px 12px; border-radius:6px; cursor:pointer; font-size:12px; white-space:nowrap;
  }
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:#1f6feb;border-color:#1f6feb}
  button.danger{border-color:var(--bad);color:var(--bad)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .pane h2{
    margin:0;padding:6px 10px;font-size:10px;letter-spacing:.12em;color:var(--dim);
    border-bottom:1px solid var(--line);text-transform:uppercase;display:flex;gap:6px;align-items:center
  }
  .pane h2 .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
  .pane img{display:block;width:100%;height:auto;background:#000;min-height:120px}
  .stats{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
  .chip{
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;font-size:11px;font-family:var(--mono);color:var(--dim)
  }
  .chip b{color:var(--ink);font-weight:600}
  .chip.good{border-color:#1d4429;color:var(--ok)}
  .chip.bad{border-color:#5c2326;color:var(--bad)}
  section{padding:0 14px 12px}
  section h3{
    font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;
    margin:4px 0 6px;display:flex;align-items:center;gap:8px
  }
  section h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .log{
    background:#08090b;border:1px solid var(--line);border-radius:8px;
    font-family:var(--mono);font-size:11px;padding:8px;height:150px;overflow-y:auto
  }
  .log div{padding:1px 0;color:var(--dim);white-space:pre-wrap;word-break:break-word}
  .log .t{color:#4d5a6a;margin-right:6px}
  .log .k{color:var(--accent)}
  .log .err .k{color:var(--bad)}
  .log .err{color:#ffb4ae}
  .toks{display:flex;flex-wrap:wrap;gap:5px;min-height:22px}
  .tok{
    font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;
    background:#2a0d2a;border:1px solid #5c2a5c;color:#ff7bff
  }
  .empty{color:var(--dim);font-size:11px;font-style:italic}
  .banner{
    margin:0 14px 10px;padding:8px 10px;border-radius:6px;font-size:12px;
    border:1px solid #5c2326;background:#231316;color:#ffb4ae;display:none
  }
  .banner.show{display:block}
  .banner b{display:block;margin-bottom:2px;color:var(--bad)}
  .banner code{font-family:var(--mono);font-size:11px}

  /* Expanded window: fill the screen, larger type. */
  body.wide{width:auto;max-height:none;font-size:15px}
  body.wide header{padding:14px 24px}
  body.wide header h1{font-size:20px}
  body.wide .bar{padding:12px 24px}
  body.wide button{font-size:14px;padding:9px 16px}
  body.wide input[type=text]{font-size:15px;padding:10px 12px}
  body.wide .grid{gap:18px;padding:18px 24px}
  body.wide .pane h2{font-size:12px;padding:8px 12px}
  body.wide .stats{padding:0 24px 14px}
  body.wide .chip{font-size:13px;padding:5px 12px}
  body.wide section{padding:0 24px 16px}
  body.wide .log{height:280px;font-size:12.5px}
  body.wide .tok{font-size:12px}
  body.wide #btnExpand{display:none}
</style>
</head>
<body>
<header>
  <h1>AAVARAN</h1>
  <span class="sub">glass box</span>
  <span class="spacer"></span>
  <span class="status"><span class="dot" id="dOcr"></span>ocr</span>
  <span class="status"><span class="dot" id="dFace"></span>face</span>
  <span class="status"><span class="dot" id="dSrv"></span>server</span>
</header>

<div class="banner" id="banner"></div>

<div class="bar">
  <input type="text" id="goal" placeholder="Goal — e.g. open the statements page and download the latest one" />
  <button class="primary" id="btnRun">Run</button>
  <button class="danger" id="btnStop" disabled>Stop</button>
</div>
<div class="bar">
  <button id="btnCapture">Capture &amp; Veil</button>
  <button id="btnPreflight">Preflight</button>
  <button id="btnVault">Vault</button>
  <button id="btnPurge">Purge vault</button>
  <button id="btnNarrate" title="Read this page aloud, locally">Narrate</button>
  <button id="btnExpand" title="Open the Glass Box in a large window">⤢ Expand</button>
  <span class="spacer"></span>
  <span class="status" id="runState">idle</span>
</div>

<div class="grid">
  <div class="pane">
    <h2>Raw capture <span class="tag" id="tagRaw">—</span></h2>
    <img id="imgRaw" alt="raw capture">
  </div>
  <div class="pane">
    <h2>Veiled + Set-of-Mark <span class="tag" id="tagVeil">—</span></h2>
    <img id="imgVeil" alt="veiled frame">
  </div>
</div>

<div class="stats" id="stats"></div>

<section>
  <h3>Tokens in vault (local only)</h3>
  <div class="toks" id="tokens"><span class="empty">nothing tokenized yet</span></div>
</section>

<section>
  <h3>Trace</h3>
  <div class="log" id="log"></div>
</section>

<script src="panel.js"></script>
</body>
</html>
